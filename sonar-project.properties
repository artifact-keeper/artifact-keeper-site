sonar.projectKey=artifact-keeper_artifact-keeper-site
sonar.organization=artifact-keeper
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,.astro/**
sonar.sourceEncoding=UTF-8
# src/data holds hand-written tables (formats, use cases, vendor comparison); repeated
# object shapes there are data, not duplicated logic.
sonar.cpd.exclusions=src/data/**
# The site has no automated test harness (see docs/TEST_PLAN.md): browser animation
# scripts and build-time SVG helpers are verified by building and rendering the pages.
sonar.coverage.exclusions=src/scripts/**,src/lib/**,src/data/**
